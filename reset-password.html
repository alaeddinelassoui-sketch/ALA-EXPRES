
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f5b">
  <title>تغيير كلمة المرور - ALA EXPRESS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #f3f6f5;
      font-family: Arial, sans-serif;
    }
    .box {
      width: 100%;
      max-width: 400px;
      padding: 25px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px #0001;
    }
    h2 { text-align: center; color: #087f5b; }
    p { line-height: 1.7; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0;
      background: #087f5b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="box">
    <h2>ALA EXPRESS 🚚</h2>
    <p>أدخل كلمة المرور الجديدة مرتين لتحديثها.</p>
    <form id="resetForm">
      <input id="password" type="password" placeholder="كلمة المرور الجديدة" minlength="8" required autocomplete="new-password">
      <input id="confirmPassword" type="password" placeholder="تأكيد كلمة المرور" minlength="8" required autocomplete="new-password">
      <button id="submitBtn" type="submit">حفظ كلمة المرور</button>
    </form>
    <p id="message" role="status"></p>
  </div>
</body>
</html>
